version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Web Console port
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

  # Auto-create the bucket on startup
  minio-create-bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/fastapi-blog-uploads;
      /usr/bin/mc anonymous set public myminio/fastapi-blog-uploads/profile_pics;
      exit 0;
      "

volumes:
  minio_data: